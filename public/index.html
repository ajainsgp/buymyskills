<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Theme color -->
    <meta name="theme-color" content="#000000" />

    <!-- ✅ SEO: Title -->
    <title>BuyMySkills | Hire Skilled Professionals & Freelancers</title>

    <!-- ✅ SEO: Meta Description -->
    <meta
      name="description"
      content="BuyMySkills connects you with verified professionals and freelancers across development, design, marketing, consulting, and more. Hire talent with confidence."
    />

    <!-- ⚠️ Keywords (optional, low impact) -->
    <meta
      name="keywords"
      content="hire freelancers, buy skills, hire talent, remote professionals, developers, designers, consultants"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="BuyMySkills | Hire Skilled Professionals & Freelancers" />
    <meta property="og:description"
      content="Find and hire verified professionals across development, design, marketing, and consulting." />
    <meta property="og:url" content="https://www.buymyskills.com/" />
    <meta property="og:image" content="https://www.buymyskills.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />


    <!-- ✅ Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "BuyMySkills",
      "url": "https://www.buymyskills.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.buymyskills.com/browse?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- ✅ Canonical URL -->
    <link rel="canonical" href="https://www.buymyskills.com/" />

    <!-- Apple Icon -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
